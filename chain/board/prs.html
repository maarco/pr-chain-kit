.dl>div{display:flex;min-width:max-content;color:var(--muted)}.dl i{flex:0 0 40px;text-align:right;padding-right:8px;color:var(--faint);font-style:normal;user-select:none}.dl b{font-weight:400;white-space:pre;padding-right:12px}

#files.wrap .dl>div{min-width:0}#files.wrap .dl b{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}.row .a.new{color:var(--hi)}.df .rz.y{height:9px}.df .rz.y::after{top:4px;left:40%;right:40%;height:2px}

 main{padding:10px 14px 0}dl{grid-template-columns:minmax(0,1fr)}}

</style></head><body><main>
<div class="top"><div class="brand"><a href="/">Board</a><a class="on" href="/prs">Pull Requests</a><a href="/issues">Issues</a><a href="/spend">Spend</a><a href="/config">Config</a><a href="/wiki">Wiki</a></div><div class="meta"><span id="meta"></span> · <span title="j / k: next or previous pull request&#10;/: filter the list&#10;o: open on GitHub&#10;r: read GitHub again&#10;e: expand or collapse every file&#10;v: jump to the latest verdict&#10;Esc: back to the list" style="cursor:help">Keys</span></div></div>
<div class="grid">
 <div class="col" id="listcol">
  <div class="bar"><input id="q" placeholder="Filter By Number, Title, Branch Or Author" autocomplete="off" spellcheck="false">
   <div class="sw" id="sw"><a data-s="open">Open</a><a data-s="merged">Merged</a><a data-s="closed">Closed</a></div></div>
  <div class="tools" id="tools"></div>
  <div class="scroll" id="list"></div>
 </div>
 <div class="rz x" id="vsplit" data-rz="lw" title="Drag To Resize, Double-Click To Reset"></div>
 <div class="col" id="detcol"><div id="dh"></div><div class="rz y" data-rz="hh" title="Drag To Resize, Double-Click To Reset"></div><div class="scroll" id="det"></div></div>
</div>
</main>
<script src="/runs.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=Object.assign({which:'open',q:'',sort:'updated',flt:{},wrap:false,chg:false,shut:{}},JSON.parse(localStorage.getItem('prs.prefs')||'{}')),seen=JSON.parse(localStorage.getItem('prs.seen')||'{}');
const save=()=>{localStorage.setItem('prs.prefs',JSON.stringify(P));localStorage.setItem('prs.seen',JSON.stringify(seen))};let cq='';
let which=P.which,prs=[],sel=null,det=null,openC=new Set(),only=false,bodyOpen=false,openF=new Set(),diff=null,diffErr='';
function ago(t){if(!t)return'';const s=(Date.now()-new Date(t))/1e3;if(s<90)return'now';if(s<5400)return Math.round(s/60)+'m';if(s<129600)return Math.round(s/3600)+'h';return Math.round(s/86400)+'d'}
const since=t=>{const a=ago(t);return !a?'':a==='now'?'just now':a+' ago'};
const tk=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n||0);
const us=n=>n?' · ~$'+(n>=100?Math.round(n):n>=0.01?n.toFixed(2):'0.01'):'';
const low=s=>String(s||'').toLowerCase().replace(/_/g,' ');
function md(s){const keep=[];s=esc(s).replace(/```[^\n]*\n([\s\S]*?)```/g,(m,c)=>{keep.push('<pre>'+c.replace(/\n$/,'')+'</pre>');return'\u0000'+(keep.length-1)+'\u0000'});
 const pic=(u,alt)=>{u=u.replace(/&amp;/g,'&');if(!/^https:\/\/[^\s"'<>]+$/.test(u))return null;keep.push('<a class="shot" href="'+esc(u)+'" target="_blank" rel="noopener" title="'+alt+'"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'" alt="'+alt+'"><span>'+alt+'</span></a>');return'\u0000'+(keep.length-1)+'\u0000'};
 s=s.replace(/&lt;img\b([\s\S]*?)&gt;/g,(m,at)=>{const g=n=>((at.match(new RegExp('\\b'+n+'=(?:&quot;|&#39;|"|\')(.*?)(?:&quot;|&#39;|"|\')'))||[])[1]||'');return pic(g('src'),g('alt'))||m})
  .replace(/!\[([^\]\n]*)\]\((https:\/\/[^\s)]+)\)/g,(m,alt,u)=>pic(u,alt)||m).replace(/(\u0000\d+\u0000)\s+(?=\u0000\d+\u0000)/g,'$1');
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,6}\s+(.*)$/gm,'<b>$1</b>')
  .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>').replace(/\n{3,}/g,'\n\n');
 return blocks(s).replace(/\u0000(\d+)\u0000\n?/g,(m,i)=>keep[i])}
function blocks(s){const out=[];let para=[],list=null;
 const fp=()=>{if(para.length){out.push('<p>'+para.join('\n')+'</p>');para=[]}},fl=()=>{if(list){out.push('<'+list.t+'>'+list.i.join('')+'</'+list.t+'>');list=null}};
 s.split('\n').forEach(l=>{let m;
  if(m=l.match(/^\s*(?:[-*]|(\d+)\.)\s+(.*)$/)){fp();const t=m[1]?'ol':'ul';if(!list||list.t!==t){fl();list={t,i:[]}}
   let b=m[2];const st=b.match(/^(ok|pass|fail|warn|n\/a)\s+-\s+(.*)$/i);if(st)b='<span class="'+(/ok|pass/i.test(st[1])?'ok':/fail/i.test(st[1])?'bad':/warn/i.test(st[1])?'warn':'dim')+'">'+st[1]+'</span> '+st[2];
   const k=b.indexOf(' — ');if(k>0)b=b.slice(0,k)+'<span class="res">'+b.slice(k+3)+'</span>';
   list.i.push('<li'+(m[1]?' value="'+m[1]+'"':'')+'>'+b+'</li>');return}
  if(list&&/^\s{2,}\S/.test(l)){list.i[list.i.length-1]=list.i[list.i.length-1].replace(/<\/li>$/,' '+l.trim()+'</li>');return}
  fl();if(!l.trim()){fp();return}
  if(m=l.match(/^(PASS|FAIL|READY|NOT READY|BEHIND|BLOCKED|FIXED|DISPUTE)$/)){fp();out.push('<div class="vd '+vcls(m[1])+'">'+m[1]+'</div>');return}
  if(m=l.match(/^(head|base) ([0-9a-f]{40})$/)){fp();out.push('<div class="kl"><span class="f">'+m[1]+'</span><code title="'+m[2]+'">'+m[2].slice(0,12)+'</code></div>');return}
  if(m=l.match(/^<b>([^<]+?):?<\/b>:?$/)||l.match(/^([A-Z][A-Za-z0-9 \/-]{1,38}):$/)){fp();out.push('<div class="lb">'+m[1]+'</div>');return}
  if(m=l.match(/^([A-Z][A-Za-z -]{1,22}): (.+)$/)){fp();out.push('<div class="kl"><span class="f">'+m[1]+'</span><span>'+m[2]+'</span></div>');return}
  if(/^(\u0000\d+\u0000)+$/.test(l)){fp();out.push(l);return}
  para.push(l)});fp();fl();return out.join('')}
const vcls=v=>/PASS|APPROVED|^READY|BATCH-READY|SUCCESS|MERGED|CLEAN/.test(v)?'ok':/FAIL|CHANGES|NOT READY|ERROR|DIRTY|CONFLICT/.test(v)?'bad':/HUMAN|BEHIND|BLOCKED|TIMEOUT|UNSTABLE|REVIEW_REQUIRED|DRAFT/.test(v)?'warn':'dim';
function ck(p){return p.fail?`<span class="bad">${p.fail} failing</span>`:p.wait?`<span class="warn">${p.wait} running</span>`:p.ok?`<span class="ok">checks pass</span>`:'no checks'}
function listHtml(){const q=$('q').value.trim().toLowerCase(),rows=prs.filter(p=>(!q||('#'+p.n+' '+p.title+' '+p.branch+' '+p.author+' '+p.chain).toLowerCase().includes(q))&&(!P.flt.human||/human/i.test(p.chain||''))&&(!P.flt.fail||p.fail)&&(!P.flt.ui||p.ui));
 if(P.sort==='number')rows.sort((a,b)=>b.n-a.n);else if(P.sort==='size')rows.sort((a,b)=>b.add+b.rem-a.add-a.rem);
 $('tools').innerHTML=`<a data-sort title="Click To Change The Order">Sort: ${{updated:'Updated',number:'Number',size:'Size'}[P.sort]}</a>${[['human','Needs Human'],['fail','Failing'],['ui','UI']].map(([k,l])=>`<a data-f="${k}"${P.flt[k]?' class="on"':''}>${l}</a>`).join('')}<span class="cnt">${rows.length===prs.length?'':rows.length+' of '+prs.length}</span>`;
 $('list').innerHTML=rows.length?rows.map(p=>`<div class="row${p.n===sel?' sel':''}" data-n="${p.n}"><span class="n">#${p.n}</span><span class="t">${esc(p.title)}</span><span class="a${seen[p.n]&&p.at>seen[p.n]&&p.n!==sel?' new" title="Changed Since You Last Opened It':''}">${ago(p.at)}</span>
  <span class="s">${ck(p)} · ${p.draft?'draft · ':''}${p.merge&&p.state==='OPEN'?`<span class="${vcls(p.merge)}">${low(p.merge)}</span> · `:''}+${p.add} −${p.rem}${p.ui?' · UI':''}${p.tok?' · '+tk(p.tok)+' tokens'+us(p.usd):''}${p.chain?` · chain <span class="${vcls(p.chain)}">${low(p.chain)}</span>`:''}</span></div>`).join('')
  :`<div class="empty">${prs.length?'No pull request matches the filter.':'Loading pull requests from GitHub…'}</div>`;
 document.querySelectorAll('#sw a').forEach(a=>a.classList.toggle('on',a.dataset.s===which))}
async function loadList(fresh){try{const r=await (await fetch('/api/prs?state='+which+(fresh?'&fresh=1':''))).json();
  if(r.error){$('meta').innerHTML='<span class="warn">'+esc(r.error)+'</span>';return}
  if(r.state!==which)return;prs=r.prs;markSeen();$('meta').textContent=`${prs.length} ${which} · GitHub read ${r.age<5?'just now':r.age+' s ago'}`;listHtml()}
 catch(e){$('meta').innerHTML='<span class="bad">Board server not answering</span>'}}
function attn(d){const ch=d.chain;if(!ch||d.state!=='OPEN'||!/^(AWAIT-HUMAN|NEEDS-PERSON|STUCK|HOLD-UI|LAND-STOPPED|CI-TIMEOUT|ERROR|MAIN-MOVING|UI-FAILED)$/.test(ch.status||''))return'';
 const n=d.n,why=String(ch.why||''),c=d.checks,h8=String(ch.head||'').slice(0,8),cp=x=>`<code>${esc(x)}</code> <a data-copy="${esc(x)}">Copy</a>`,gh=(t,u)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`;
 const again=`Run the chain again: ${cp('pr-chain run '+n+' --land')}`,land=`Land it: ${cp('pr-chain land '+n+' --land')}`,verdict='<a data-attn="v">Open The Latest Verdict</a>';
 const when=`stopped ${since(ch.updated)} at ${h8}, round ${ch.round??0}`;
 if(ch.head&&ch.head!==d.head&&ch.status!=='NEEDS-PERSON')return`<div class="at"><div class="ah"><span class="dim">Nothing To Do Yet</span><span class="f">${when}</span></div><div>A new push arrived after this stop (the head is now ${d.head.slice(0,8)}). The loop runs this pull request again on its own within about 10 minutes.</div></div>`;
 let what='',steps=[];
 if(ch.status==='AWAIT-HUMAN'){what='The UI review passed. The chain posted screenshots of the changed screens and waits for your look before it merges.';
  steps=[`Look at the screenshots: <a data-attn="g">Show Them Here</a> or ${gh('Open Them On GitHub',d.url+(ch.gate_comment?'#issuecomment-'+ch.gate_comment:''))}.`,
   `They look right: ${gh('on GitHub',d.url)}, add the label ${cp('human-approved')}. The loop then waits for CI and merges on its next lap.`,

function ledHtml(L){if(!L.length)return '';const runs=[];let cur=[];L.forEach(r=>{cur.push(r);if(r.stage==='end'){runs.push(cur);cur=[]}});if(cur.length)runs.push(cur);
