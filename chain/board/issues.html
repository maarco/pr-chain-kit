<div class="top"><div class="brand"><a href="/">Board</a><a href="/prs">Pull Requests</a><a class="on" href="/issues">Issues</a><a href="/spend">Spend</a><a href="/config">Config</a><a href="/wiki">Wiki</a></div><div class="meta"><span id="meta"></span> · <span title="j / k: next or previous issue&#10;/: filter the list&#10;o: open on GitHub&#10;r: read GitHub again&#10;Esc: back to the list" style="cursor:help">Keys</span></div></div>
<div class="grid">

</div>
</main>
<script src="/runs.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(t){if(!t)return'';const s=(Date.now()-new Date(t))/1e3;if(s<90)return'now';if(s<5400)return Math.round(s/60)+'m';if(s<129600)return Math.round(s/3600)+'h';return Math.round(s/86400)+'d'}
const since=t=>{const a=ago(t);return !a?'':a==='now'?'just now':a+' ago'};
const tk=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n||0);
const us=n=>n?' · ~$'+(n>=100?Math.round(n):n>=0.01?n.toFixed(2):'0.01'):'';
const low=s=>String(s||'').toLowerCase().replace(/_/g,' ');
function md(s){const keep=[];s=esc(s).replace(/```[^\n]*\n([\s\S]*?)```/g,(m,c)=>{keep.push('<pre>'+c.replace(/\n$/,'')+'</pre>');return'\u0000'+(keep.length-1)+'\u0000'});
 const pic=(u,alt)=>{u=u.replace(/&amp;/g,'&');if(!/^https:\/\/[^\s"'<>]+$/.test(u))return null;keep.push('<a class="shot" href="'+esc(u)+'" target="_blank" rel="noopener" title="'+alt+'"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'" alt="'+alt+'"><span>'+alt+'</span></a>');return'\u0000'+(keep.length-1)+'\u0000'};
 s=s.replace(/&lt;img\b([\s\S]*?)&gt;/g,(m,at)=>{const g=n=>((at.match(new RegExp('\\b'+n+'=(?:&quot;|&#39;|"|\')(.*?)(?:&quot;|&#39;|"|\')'))||[])[1]||'');return pic(g('src'),g('alt'))||m})
  .replace(/!\[([^\]\n]*)\]\((https:\/\/[^\s)]+)\)/g,(m,alt,u)=>pic(u,alt)||m).replace(/(\u0000\d+\u0000)\s+(?=\u0000\d+\u0000)/g,'$1');
 s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,6}\s+(.*)$/gm,'<b>$1</b>')
  .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>').replace(/\n{3,}/g,'\n\n');
 return blocks(s).replace(/\u0000(\d+)\u0000\n?/g,(m,i)=>keep[i])}
function blocks(s){const out=[];let para=[],list=null;
 const fp=()=>{if(para.length){out.push('<p>'+para.join('\n')+'</p>');para=[]}},fl=()=>{if(list){out.push('<'+list.t+'>'+list.i.join('')+'</'+list.t+'>');list=null}};
 s.split('\n').forEach(l=>{let m;
  if(m=l.match(/^\s*(?:[-*]|(\d+)\.)\s+(.*)$/)){fp();const t=m[1]?'ol':'ul';if(!list||list.t!==t){fl();list={t,i:[]}}
   let b=m[2];const st=b.match(/^(ok|pass|fail|warn|n\/a)\s+-\s+(.*)$/i);if(st)b='<span class="'+(/ok|pass/i.test(st[1])?'ok':/fail/i.test(st[1])?'bad':/warn/i.test(st[1])?'warn':'dim')+'">'+st[1]+'</span> '+st[2];
   const k=b.indexOf(' — ');if(k>0)b=b.slice(0,k)+'<span class="res">'+b.slice(k+3)+'</span>';
   list.i.push('<li'+(m[1]?' value="'+m[1]+'"':'')+'>'+b+'</li>');return}
  if(list&&/^\s{2,}\S/.test(l)){list.i[list.i.length-1]=list.i[list.i.length-1].replace(/<\/li>$/,' '+l.trim()+'</li>');return}
  fl();if(!l.trim()){fp();return}
  if(m=l.match(/^(PASS|FAIL|READY|NOT READY|BEHIND|BLOCKED|FIXED|DISPUTE)$/)){fp();out.push('<div class="vd '+vcls(m[1])+'">'+m[1]+'</div>');return}
  if(m=l.match(/^(head|base) ([0-9a-f]{40})$/)){fp();out.push('<div class="kl"><span class="f">'+m[1]+'</span><code title="'+m[2]+'">'+m[2].slice(0,12)+'</code></div>');return}
  if(m=l.match(/^<b>([^<]+?):?<\/b>:?$/)||l.match(/^([A-Z][A-Za-z0-9 \/-]{1,38}):$/)){fp();out.push('<div class="lb">'+m[1]+'</div>');return}
  if(m=l.match(/^([A-Z][A-Za-z -]{1,22}): (.+)$/)){fp();out.push('<div class="kl"><span class="f">'+m[1]+'</span><span>'+m[2]+'</span></div>');return}
  if(/^(\u0000\d+\u0000)+$/.test(l)){fp();out.push(l);return}
  para.push(l)});fp();fl();return out.join('')}
const vcls=v=>/PASS|APPROVED|^READY|SUCCESS|MERGED|CLEAN/.test(v)?'ok':/FAIL|CHANGES|NOT READY|ERROR|DIRTY|CONFLICT/.test(v)?'bad':/HUMAN|BEHIND|BLOCKED|TIMEOUT|UNSTABLE|REVIEW_REQUIRED|DRAFT/.test(v)?'warn':'dim';
const P=Object.assign({which:'open',q:'',sort:'updated',flt:{},shut:{}},JSON.parse(localStorage.getItem('issues.prefs')||'{}')),seen=JSON.parse(localStorage.getItem('issues.seen')||'{}');
const save=()=>{localStorage.setItem('issues.prefs',JSON.stringify(P));localStorage.setItem('issues.seen',JSON.stringify(seen))};let cq='';
let which=P.which==='closed'?'closed':'open',items=[],sel=null,det=null,openC=new Set(),bodyOpen=false;
const FLT=[['bug','Bugs',i=>i.labels.includes('bug')],['enh','Enhancements',i=>i.labels.includes('enhancement')],['ready','Ready For Agent',i=>i.labels.includes('status/ready-for-agent')],['nopr','No Pull Request',i=>!i.prs.length]];
const SORT={updated:'Updated',number:'Number',created:'Created'};
const stCls=i=>i.state==='OPEN'?'ok':'dim';
const stTxt=i=>i.state==='OPEN'?'open':'closed'+(i.reason&&i.reason!=='COMPLETED'?' as '+low(i.reason):'');
const prLink=p=>`<a class="link" href="/prs#${p.n}" title="Open In The Pull Requests Tab">PR #${p.n}</a>${p.chain?` <span class="${vcls(p.chain)}">${low(p.chain)}</span>`:''}`;
function listHtml(){const q=$('q').value.trim().toLowerCase(),rows=items.filter(i=>(!q||('#'+i.n+' '+i.title+' '+i.author+' '+i.labels.join(' ')+' '+i.who.join(' ')).toLowerCase().includes(q))&&FLT.every(([k,,f])=>!P.flt[k]||f(i)));
 if(P.sort==='number')rows.sort((a,b)=>b.n-a.n);else if(P.sort==='created')rows.sort((a,b)=>a.created<b.created?1:-1);else rows.sort((a,b)=>a.at<b.at?1:-1);
 $('tools').innerHTML=`<a data-sort title="Click To Change The Order">Sort: ${SORT[P.sort]||'Updated'}</a>${FLT.map(([k,l])=>`<a data-f="${k}"${P.flt[k]?' class="on"':''}>${l}</a>`).join('')}<span class="cnt">${rows.length===items.length?'':rows.length+' of '+items.length}</span>`;
 $('list').innerHTML=rows.length?rows.map(i=>{const bits=[];if(i.state!=='OPEN'&&i.reason&&i.reason!=='COMPLETED')bits.push(low(i.reason));
   i.prs.forEach(p=>bits.push(`PR #${p.n}${p.chain?` <span class="${vcls(p.chain)}">${low(p.chain)}</span>`:''}`));
   if(i.tok)bits.push(tk(i.tok)+' tokens'+us(i.usd));
   if(i.chain)bits.push(`build <span class="${vcls(i.chain)}">${low(i.chain)}</span>`);
   if(i.labels.length)bits.push(esc(i.labels.join(', ')));if(i.who.length)bits.push(esc(i.who.join(', ')));
   return `<div class="row${i.n===sel?' sel':''}" data-n="${i.n}"><span class="n">#${i.n}</span><span class="t">${esc(i.title)}</span><span class="a${seen[i.n]&&i.at>seen[i.n]&&i.n!==sel?' new" title="Changed Since You Last Opened It':''}">${ago(i.at)}</span>
  <span class="s">${bits.join(' · ')||'no labels'}</span></div>`}).join('')
  :`<div class="empty">${items.length?'No issue matches the filter.':'Loading issues from GitHub…'}</div>`;
 document.querySelectorAll('#sw a').forEach(a=>a.classList.toggle('on',a.dataset.s===which))}
async function loadList(fresh){try{const r=await (await fetch('/api/issues?state='+which+(fresh?'&fresh=1':''))).json();
  if(r.error){$('meta').innerHTML='<span class="warn">'+esc(r.error)+'</span>';return}
  if(r.state!==which)return;items=r.issues;markSeen();$('meta').textContent=`${items.length} ${which} · GitHub read ${r.age<5?'just now':r.age+' s ago'}`;listHtml()}
 catch(e){$('meta').innerHTML='<span class="bad">Board server not answering</span>'}}
function kv(k,v){return v?`<div><dt>${k}</dt><dd>${v}</dd></div>`:''}
function detHtml(){const d=det;if(!d||d.error)$('dh').innerHTML='';if(!d){$('det').innerHTML=`<div class="empty">${sel?'Loading #'+sel+' from GitHub…':'Select an issue to see its properties and conversation.'}</div>`;return}
 if(d.error){$('det').innerHTML=`<div class="empty"><a class="link" id="back">Back To List</a> <span class="warn">${esc(d.error)}</span></div>`;return}
 const ch=d.chain;
 $('dh').innerHTML=`<h1><span class="num">#${d.n}</span>${esc(d.title)}</h1>
 <div class="facts">${esc(d.author)} · opened ${since(d.created)} · updated ${since(d.at)} · ${d.thread.length} ${d.thread.length===1?'comment':'comments'}</div>
 <div class="act"><a id="back">Back To List</a><a href="${esc(d.url)}" target="_blank" rel="noopener">Open On GitHub</a><a data-copy="pr-chain issue ${d.n}">Copy Chain Command</a><a data-copy="Fixes #${d.n}">Copy Fixes Line</a><a id="fresh">Refresh</a></div>
 <dl>${kv('State',`<span class="${stCls(d)}">${stTxt(d)}</span>${d.closed?' '+ago(d.closed)+' ago':''}`)}
 ${kv('Tokens',d.tok?tk(d.tok)+' across its pull requests'+us(d.usd)+(d.usd?' at API rates':''):'none recorded')}
 ${kv('Pull Requests',d.prs.length?d.prs.map(prLink).join(' · '):'none linked')}
 ${kv('Labels',d.labels.map(esc).join(', ')||'none')}
 ${kv('Assignees',d.who.map(esc).join(', ')||'nobody')}
 ${kv('Milestone',esc(d.milestone||''))}
 ${kv('Chain Build',ch?`<span class="${vcls(ch.status||'')}">${low(ch.status)}</span>${ch.pr?` · <a class="link" href="/prs#${ch.pr}">PR #${ch.pr}</a>`:''}`:'never run')}
 </dl>${ch&&ch.why?`<dl class="one">${kv('Chain Note',esc(ch.why))}</dl>`:''}`;
 $('det').innerHTML=`<h2>Description</h2>${d.body?`<div class="md${bodyOpen?'':' clip'}" id="body">${md(d.body)}</div>`:'<div class="dim">No description.</div>'}
 <h2>Conversation <span><input id="cq" placeholder="Search Comments" value="${esc(cq)}" autocomplete="off" spellcheck="false"><a class="link" id="all">${openC.size?'Collapse All':'Expand All'}</a>${d.thread.length}</span></h2>
 ${d.thread.length?d.thread.map((x,id)=>`<div class="c${openC.has(id)?' open':''}" data-c="${id}"><span class="mono f">${ago(x.at)}</span><span class="w">${esc(x.who)}</span>
  <span class="l">${esc(x.first)}</span><div class="b"><div class="md">${md(x.body)}</div>${x.url?`<a class="link" href="${esc(x.url)}" target="_blank" rel="noopener">Open This Comment On GitHub</a>`:''}</div></div>`).join(''):'<div class="dim">No comments.</div>'}${Runs.html()}`;
 secs();cqApply()}
function secs(){let shut=false;[...$('det').children].forEach(el=>{if(el.tagName==='H2'){const k=el.firstChild.textContent.trim();shut=!!P.shut[k];el.dataset.sec=k;el.classList.toggle('shut',shut);el.title='Click To Hide Or Show This Section'}else el.hidden=shut})}
function cqApply(){const q=cq.trim().toLowerCase();document.querySelectorAll('#det .c').forEach(el=>{const x=det.thread[+el.dataset.c];el.style.display=!q||(x.who+' '+x.first+' '+x.body).toLowerCase().includes(q)?'':'none'})}
function markSeen(){const p=items.find(p=>p.n===sel);if(p&&seen[p.n]!==p.at){seen[p.n]=p.at;save()}}
function redraw(){const y=$('det').scrollTop;detHtml();$('det').scrollTop=y}
async function loadDet(fresh){const n=sel;if(!n)return;try{const r=await (await fetch('/api/issue/'+n+(fresh?'?fresh=1':''))).json();if(n!==sel)return;const y=$('det').scrollTop;det=r;detHtml();$('det').scrollTop=y;if(!r.error)Runs.load('issue',n,redraw)}catch(e){}}
function pick(n,push){if(n===sel&&det)return;sel=n;det=null;openC=new Set();bodyOpen=false;cq='';markSeen();document.body.classList.toggle('d',!!n);if(push)history.pushState(null,'',n?'#'+n:location.pathname);listHtml();detHtml();$('det').scrollTop=0;loadDet()}
$('list').onclick=e=>{const r=e.target.closest('.row');if(r)pick(+r.dataset.n,true)};
$('sw').onclick=e=>{const s=e.target.dataset.s;if(s&&s!==which){which=P.which=s;save();items=[];listHtml();loadList()}};
$('q').value=P.q;$('q').oninput=()=>{P.q=$('q').value;save();listHtml()};
$('tools').onclick=e=>{const t=e.target;if('sort' in t.dataset)P.sort={updated:'number',number:'created',created:'updated'}[P.sort]||'updated';else if(t.dataset.f)P.flt[t.dataset.f]=!P.flt[t.dataset.f];else return;save();listHtml()};
$('det').addEventListener('input',e=>{if(e.target.id==='cq'){cq=e.target.value;cqApply()}});
$('detcol').onclick=e=>{const t=e.target;if(t.closest('a[href]'))return;
 if(Runs.click(t,redraw))return;
 if(t.id==='back'){pick(null,true);return}
 if(t.id==='fresh'){t.textContent='Reading GitHub…';loadDet(true);loadList(true);return}
 if(t.dataset.copy){navigator.clipboard.writeText(t.dataset.copy);const o=t.textContent;t.textContent='Copied';setTimeout(()=>t.textContent=o,900);return}
 if(t.id==='cq')return;
 if(t.tagName==='H2'&&t.dataset.sec){P.shut[t.dataset.sec]=!P.shut[t.dataset.sec];save();secs();return}
 if(t.id==='all'){if(openC.size)openC.clear();else det.thread.forEach((x,i)=>openC.add(i));redraw();return}
 if(t.closest('#body')){if(!bodyOpen){bodyOpen=true;redraw()}return}
 const c=t.closest('.c');if(c&&!t.closest('.b')){const i=+c.dataset.c;openC.has(i)?openC.delete(i):openC.add(i);redraw()}};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){if(e.key==='Escape')e.target.blur();return}if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(det&&!det.error&&'or'.includes(e.key)){if(e.key==='o')window.open(det.url,'_blank','noopener');else{loadDet(true);loadList(true)}return}
 if(e.key==='/'){e.preventDefault();$('q').focus()}else if(e.key==='Escape')pick(null,true);
 else if(e.key==='j'||e.key==='k'){const rows=[...document.querySelectorAll('.row')].map(r=>+r.dataset.n);if(!rows.length)return;let i=rows.indexOf(sel);i=i<0?0:Math.max(0,Math.min(rows.length-1,i+(e.key==='j'?1:-1)));pick(rows[i],true);document.querySelector('.row.sel')?.scrollIntoView({block:'nearest'})}});
let rz=null;const grid=document.querySelector('.grid');
function setLw(w){w=Math.max(220,Math.min(w,grid.clientWidth-345));grid.style.setProperty('--lw',w+'px');return w}
function setHh(v){v=Math.max(26,Math.min(v,$('detcol').clientHeight-110));$('dh').style.height=v+'px';$('dh').style.maxHeight='none';return v}
addEventListener('pointerdown',e=>{const h=e.target.closest('.rz');if(!h)return;e.preventDefault();const k=h.dataset.rz,el=k==='lw'?$('listcol'):h.previousElementSibling,r=el.getBoundingClientRect();
 rz={h,k,s:k==='lw'?e.clientX:e.clientY,v:k==='lw'?r.width:r.height};h.classList.add('on');h.setPointerCapture(e.pointerId)});
addEventListener('pointermove',e=>{if(!rz)return;const v=rz.v+((rz.k==='lw'?e.clientX:e.clientY)-rz.s);rz.out=rz.k==='lw'?setLw(v):setHh(v)});
const rzEnd=()=>{if(!rz)return;rz.h.classList.remove('on');if(rz.out)localStorage.setItem('issues.'+rz.k,Math.round(rz.out));rz=null};
addEventListener('pointerup',rzEnd);addEventListener('pointercancel',rzEnd);
addEventListener('dblclick',e=>{const h=e.target.closest('.rz');if(!h)return;if(h.dataset.rz==='lw'){grid.style.removeProperty('--lw');localStorage.removeItem('issues.lw')}
 else{$('dh').style.height='';$('dh').style.maxHeight='';localStorage.removeItem('issues.hh')}});
function sizes(){const w=+localStorage.getItem('issues.lw'),v=+localStorage.getItem('issues.hh');if(w)setLw(w);const d=$('dh');if(innerWidth<=900||$('detcol').clientHeight<240){d.style.height='';d.style.maxHeight=''}else if(v)setHh(v)}
sizes();addEventListener('resize',sizes);
function fromHash(){const n=parseInt(location.hash.slice(1));pick(n||null,false)}
addEventListener('popstate',fromHash);
loadList();fromHash();detHtml();
setInterval(()=>{if(!document.hidden){loadList();if(sel&&!String(getSelection())&&document.activeElement.id!=='cq')loadDet()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadList();if(sel&&!String(getSelection()))loadDet()}});
</script></body></html>
