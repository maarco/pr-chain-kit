<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PR Chain · Spend</title>
<style>
:root{--bg:oklch(0.145 0 0);--card:oklch(0.185 0 0);--raise:oklch(0.269 0 0);--fg:oklch(0.985 0 0);--mid:oklch(0.82 0 0);--muted:oklch(0.62 0 0);--faint:oklch(0.44 0 0);
--hi:#78be21;--bad:oklch(0.704 0.191 22.216);--warn:oklch(0.769 0.188 70.08);
--sans:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:.005em}
a{color:inherit;text-decoration:none}a:hover{color:var(--fg)}
main{max-width:1360px;margin:0 auto;padding:12px 20px 30px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;gap:18px}
.brand a{color:var(--faint)}.brand a.on{color:var(--fg)}
@media(max-width:520px){.brand{gap:12px;letter-spacing:.08em}.brand a{white-space:nowrap}}
.meta{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;display:flex;gap:16px;flex-wrap:wrap}.meta b{color:var(--fg);font-weight:500}
.sw{display:flex;gap:12px;font-size:11px;margin-top:12px;flex-wrap:wrap}.sw a{color:var(--muted);cursor:pointer}.sw a.on{color:var(--fg)}.sw span{color:var(--faint)}
.days{display:flex;gap:16px;flex-wrap:wrap;font:11px var(--mono);color:var(--muted);margin-top:8px}.days b{color:var(--mid);font-weight:400}.days i{font-style:normal;color:var(--faint)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 34px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:18px 0 6px;font-weight:500;display:flex;justify-content:space-between;gap:10px}
h2 span{letter-spacing:.02em;text-transform:none;color:var(--muted)}
.r{display:grid;grid-template-columns:46px minmax(0,1fr) 54px 58px;gap:0 10px;padding:3px 0;align-items:baseline;font-variant-numeric:tabular-nums}
.r .n{font:11px var(--mono);color:var(--muted)}.r:hover .n{color:var(--hi)}
.r .t{color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r:hover .t{color:var(--fg)}
.r .k{font:11.5px var(--mono);color:var(--fg);text-align:right}
.r .c{font:11.5px var(--mono);color:var(--mid);text-align:right}
.r .s{grid-column:2/5;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s a{color:var(--muted)}.r .s a:hover{color:var(--fg)}
.ok{color:var(--hi)}.bad{color:var(--bad)}.warn{color:var(--warn)}.dim{color:var(--muted)}
.note{color:var(--faint);font-size:11px;margin-top:16px;max-width:900px}
</style></head><body><main>
<div class="top"><div class="brand"><a href="/">Board</a><a href="/prs">Pull Requests</a><a href="/issues">Issues</a><a class="on" href="/spend">Spend</a><a href="/config">Config</a><a href="/wiki">Wiki</a></div><div class="meta" id="meta"></div></div>
<div class="sw" id="sw"></div><div class="days" id="days"></div><div class="days" id="mods"></div>
<div class="grid"><div><h2>By Pull Request<span id="pc"></span></h2><div id="prs" class="dim">Reading the ledger…</div></div>
<div><h2>By Issue<span id="ic"></span></h2><div id="iss"></div></div></div>
<div class="note" id="note"></div>
</main><script>
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tk=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n||0);
const usd=n=>n==null?'':'$'+(n>=100?Math.round(n):n>=0.005?n.toFixed(2):n>0?'0.01':'0.00');
const low=s=>String(s||'').toLowerCase().replace(/_/g,' ');
const vcls=v=>/PASS|APPROVED|^READY|SUCCESS|MERGED|CLEAN/.test(v)?'ok':/FAIL|CHANGES|NOT READY|ERROR|DIRTY|CONFLICT/.test(v)?'bad':/HUMAN|BEHIND|BLOCKED|TIMEOUT|UNSTABLE|REVIEW_REQUIRED|DRAFT/.test(v)?'warn':'dim';
let P={};try{P=JSON.parse(localStorage.getItem('spend.p')||'{}')}catch(e){}
let D=null;
function paint(){if(!D)return;const f=P.win==='today'?'today':'tok',g=f==='today'?'usd_today':'usd',by=P.sort==='recent',byc=P.sort==='cost';
 const ord=(a,b)=>by?(a.last<b.last?1:-1):byc?b[g]-a[g]:b[f]-a[f];
 $('meta').innerHTML=`<span>Today <b>${tk(D.today)}</b> ~${usd(D.usd_today)}</span><span>Since ${esc(D.since)} <b>${tk(D.total)}</b> ~${usd(D.usd)}</span>`;
 $('sw').innerHTML=`<a data-w="all"${f==='tok'?' class="on"':''}>All Time</a><a data-w="today"${f==='today'?' class="on"':''}>Today</a><span>·</span><a data-s="tok"${by||byc?'':' class="on"'}>Most Tokens First</a><a data-s="cost"${byc?' class="on"':''}>Highest Cost First</a><a data-s="recent"${by?' class="on"':''}>Latest Run First</a>`;
 $('days').innerHTML=D.days.map(d=>`<span>${esc(d.day.slice(5))} <b>${tk(d.tok)}</b> <i>${usd(d.usd)}</i></span>`).join('');
 $('mods').innerHTML=D.models.filter(m=>m.tok||m.usd).map(m=>`<span>${esc(m.model)} <b>${tk(m.tok)}</b> <i>${usd(m.usd)}</i></span>`).join('');
 const prs=D.prs.filter(p=>p[f]>0||(f==='tok'&&p.runs)).sort(ord);
 const last=Object.fromEntries(D.prs.map(p=>[p.n,p.last]));
 const iss=D.issues.filter(i=>i[f]>0||f==='tok').map(i=>({...i,last:i.prs.map(n=>last[n]||'').sort().pop()||''})).sort(ord);
 $('pc').textContent=prs.length+' with agent runs';$('ic').textContent=iss.length+' tied to those runs';
 $('prs').className='';$('prs').innerHTML=prs.length?prs.map(p=>{const st=p.chain||p.state,m=Object.entries(p.models).filter(e=>e[1][0]).sort((a,b)=>b[1][1]-a[1][1]).map(e=>esc(e[0])+' '+tk(e[1][0])+' '+usd(e[1][1])).join(', ');
  return `<div class="r"><a class="n" href="/prs#${p.n}">#${p.n}</a><a class="t" href="/prs#${p.n}" title="${esc(p.title)}">${esc(p.title||'title not read from GitHub')}</a><span class="c" title="API-rate estimate, not a charge">${usd(p[g])}</span><span class="k">${tk(p[f])}</span>
  <span class="s">${st?`<span class="${vcls(String(st).toUpperCase())}">${low(st)}</span> · `:''}${p.runs} runs${p.missing?`, ${p.missing} with no count`:''}${p.unpriced>p.missing?`, ${p.unpriced} unpriced`:''}${m?' · '+m:''} · last ${esc(p.last.slice(5,16).replace('T',' '))}${p.issues.length?' · '+p.issues.map(i=>`<a href="/issues#${i}">issue #${i}</a>`).join(' '):' · no issue found'}</span></div>`}).join(''):'<div class="dim">No agent runs in this window.</div>';
 $('iss').innerHTML=iss.length?iss.map(i=>`<div class="r"><a class="n" href="/issues#${i.n}">#${i.n}</a><a class="t" href="/issues#${i.n}" title="${esc(i.title)}">${esc(i.title||'title not read from GitHub')}</a><span class="c" title="API-rate estimate, not a charge">${usd(i[g])}</span><span class="k">${tk(i[f])}</span>
  <span class="s">${i.state?`<span class="${i.state==='OPEN'?'ok':'dim'}">${low(i.state)}</span> · `:''}${i.prs.sort((a,b)=>a-b).map(n=>`<a href="/prs#${n}">PR #${n}</a>`).join(' ')}${i.build?(i.prs.length?' · ':'')+'issue build '+tk(i.build):''}</span></div>`).join(''):'<div class="dim">No issue spend in this window.</div>';
 const rt=Object.entries(D.rates||{}).map(([k,v])=>`${k} $${v.input} in, $${v.cached_input} cached in, $${v.output} out (${v.src==='litellm'?'LiteLLM':'rates.json'})`).join('; ');
 $('note').textContent=`Dollar figures are an estimate of what these runs would cost at pay-per-token API rates. Nothing was charged: the runs go through subscriptions. A token is not one price: output costs about five times fresh input, and cached input about a tenth of it, so the dollar column weighs each kind by its own rate and counts cached input, which the token column leaves out. Rates per million tokens: ${rt}. LiteLLM is the public price table, downloaded once a day${D.rates_at?', last on '+D.rates_at:', not downloaded yet'}; an entry in chain/rates.json wins over it. Claude models use the dollar figure the Claude harness reports for the run. ${D.unpriced} of ${D.runs} runs have no price because their log has no usage record. Token column, counted when an agent run ends. Codex: the total its log prints. Claude: input, cache writes and output, cache reads left out. A pull request tied to two issues counts in full under each, so the issue column does not add up to the total. ${D.unlinked} pull requests have no issue found.`}
$('sw').onclick=e=>{const a=e.target.closest('a');if(!a)return;if(a.dataset.w)P.win=a.dataset.w;if(a.dataset.s)P.sort=a.dataset.s;localStorage.setItem('spend.p',JSON.stringify(P));paint()};
async function load(){try{const r=await (await fetch('/api/spend')).json();if(!r.error){D=r;paint()}}catch(e){}}
load();setInterval(load,30000);
</script></body></html>
