# Worked example: pr-chain on the public kollaborai/kollab repo. Copy it, swap in your own two GitHub
# accounts (one opens PRs, the other approves and merges), and point PR_CHAIN_CONFIG at your copy.

[repo]
slug = "kollaborai/kollab"
default_branch = "main"
checkout = "~/dev/kollab"
python = "~/dev/kollab/.venv/bin/python"
import_guard = "kollabor_ai"
src_globs = ["packages/*/src"]
rules_doc = "bundles/skills/kollab-development/SKILL.md"

[accounts]
authors = ["your-account", "your-bot"]
trusted = ["your-account"]
merger = "your-bot"
approver_of = { "your-bot" = "your-account", "your-account" = "your-bot" }
checks = ["ci/tests", "ci/standards-check", "ci/security-scan"]

[paths]
work = "~/backups/pr-chain"
worktree_root = "~/dev/kollab-wt/pr-chain"
lane_root = "~/dev/kollab-wt"

[labels]
human_approved = "human-approved"
blocked = ["wontfix", "duplicate", "invalid", "question", "status/blocked", "status/needs-info",
           "status/needs-repro", "status/ready-for-human"]

[changelog]
forbidden = ["CHANGELOG.md", "kollabor/updates/CHANGELOG.md"]
fragment_dir = "changes"

[ui]
enabled = true
paths_regex = '(packages/kollabor-webui/frontend/src/|\.tsx$|\.css$|\.html$|kollabor\.ai|/site/)'
proof_regex = 'frontend/tests/.+\.mjs$'
frontend_dir = "packages/kollabor-webui/frontend"
stamp_file = "packages/kollabor-webui/frontend/package.json"
stack_script = "examples/kollab/ui_stack.py"
term_shots_script = "examples/kollab/term_shots.py"
playwright_browsers_path = ""   # e.g. ~/Library/Caches/ms-playwright on macOS

[agent]
env = { KOLLAB_NO_KEYRING = "1" }

[tripwire]
settings_file = "~/.kollab/config.json"

[project]
field_guide = "examples/kollab/field-guide-project.md"

[notify]
command = ""   # a command that pages you when the loop is down, called with one message argument
