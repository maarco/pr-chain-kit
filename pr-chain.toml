# pr-chain.toml — every project-specific value the chain uses, in one file.
# Env vars always win over this file (KIT_REPO, KIT_CHECKOUT, KIT_WORK, PR_CHAIN_WT_ROOT,
# PR_CHAIN_MODELS_FILE, PR_CHAIN_FLOW, PR_CHAIN_CONFIG — the same names the scripts already read).
# `pr-chain init` writes a filled-in copy to ~/.config/pr-chain/pr-chain.toml. ~ expands; a relative path
# resolves next to the config file when it exists there, else inside the kit (e.g. examples/kollab/ui_stack.py).
# A worked example for a real repo: examples/kollab/pr-chain.toml.

[repo]
slug = "owner/name"            # the GitHub repo the chain works on
default_branch = "main"
checkout = "~/dev/name"        # a local checkout of slug; its default branch stays read-only
python = ""                    # interpreter with the repo's dev deps; empty = <checkout>/.venv/bin/python
import_guard = ""              # a module name; if set, tests in a worktree must import it FROM the worktree
src_globs = ["src"]            # PYTHONPATH roots, globbed inside a worktree (e.g. ["packages/*/src", "src"])
rules_doc = "CONTRIBUTING.md"  # the repo rules file every agent skims (repo-relative)
run_prefix = []                # prefix for the merge-time lint/test commands, {wt} = the worktree (e.g. ["uv", "run", "--project", "{wt}", "--"]); empty = python

[accounts]
authors = ["you", "your-bot"]  # the chain only ever works on PRs these accounts opened
trusted = ["you"]              # only these accounts can approve or give feedback at the human gate
merger = "your-bot"            # the gh account that merges and writes labels
approver_of = { "your-bot" = "you" }  # the non-author account named as approver per PR author (fallback: merger)
checks = ["ci/tests"]          # required CI checks the chain waits for

[paths]
work = ""                            # ledger.jsonl, prs/<n>/, logs/, scratch-home/; empty = ~/.local/state/pr-chain/work
worktree_root = ""                   # one worktree per stage; empty = ~/.local/state/pr-chain/wt
lane_status_dir = ""                 # optional: <dir>/*<pr>*/STATUS.md notes from other writers; a fresh one without DONE/BLOCKED keeps the PR off-limits
lane_root = ""                       # where sibling lane worktrees live (stale-lane detection); empty = worktree_root's parent
models_file = ""                     # models.json (commands.json, profiles.json beside it); empty = chain/models.json

# Checks the fold runs on each PR merged with main, before it pushes. None = the Python default (ruff E9/F63/F7/F82
# on changed .py files, pytest on changed test_*.py files). Each check runs once, in the merged worktree, when any
# changed path matches one of its globs; "{files}" in cmd expands to the matching files. [repo] run_prefix wraps cmd.
# [[merge_checks]]
# name = "clippy"
# match = ["*.rs", "Cargo.toml"]
# cmd = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
# timeout = 900

[labels]
human_approved = "human-approved"    # label that sends an AWAIT-HUMAN PR to CI + merge
blocked = ["wontfix", "duplicate", "invalid", "question", "status/blocked", "status/needs-info",
           "status/needs-repro", "status/ready-for-human"]   # the chain never picks issues with these

[changelog]
# Files no fixer or builder may edit (the project's changelog(s)), plus the fragment rule: a PR that
# closes an issue must add <fragment_dir>/<issue>.<section>.md with a "- ... (#issue)" bullet.
forbidden = ["CHANGELOG.md"]
fragment_dir = "changes"

# [land]
# mode = "pr"                    # "pr": land each approved PR on its own (merging main in first). "batch": a chain ends
#                                # BATCH-READY (approved, branch left alone) and `resume` lands ready PRs through one
#                                # batch PR built on current main. Roll back with "pr".
# max_base_age_hours = 48        # batch mode: a PR whose base (merge-base with main) is older than this takes main once
# batch_branch_prefix = "merge-flow/batch"   # the batch PR's branch is <prefix>-<UTC yyyymmdd-HHMMSS>

[ui]
enabled = true                       # false: no UI vision review, no screenshots, no stack
paths_regex = '(\.tsx$|\.css$|\.html$)'   # a diff touching these paths needs a UI review
proof_regex = 'frontend/tests/.+\.mjs$'   # browser-proof test files the UI reviewer is told to run
frontend_dir = ""                    # frontend folder inside the repo; node_modules is linked from the main checkout
stamp_file = ""                      # the stack stamps this file; a dirty stamp alone never blocks a worktree drop
stack_script = ""                    # script with `up --wt W --dir D --python P` / `down --dir D` (see examples/kollab/ui_stack.py)
shoot_script = ""                    # screenshot helper (default: chain/ui_shoot.py)
term_shots_script = ""               # terminal-screenshot helper for PRs that add tmux specs (see examples/kollab/term_shots.py)
playwright_browsers_path = ""        # browser cache for agents with a scratch HOME; empty = let playwright find it

[tools]
# The gh binary. Unset = the first gh on PATH, then /opt/homebrew/bin/gh, then /usr/local/bin/gh.
# gh = "/usr/local/bin/gh"

[agent]
# Extra env every agent command runs with (the app's "don't touch my real config" switches).
env = {}
# Opt-in: when set, a stage agent sees ONLY these parent variables plus [agent] env (GH_/GITHUB_/KIT_/PR_CHAIN_/KOLLAB_ are
# still stripped), and any value starting ghp_, github_pat_, gho_, ghs_ or ghu_ is dropped whatever its name. Unset = off.
# env_allowlist = ["PATH", "LANG", "TERM", "TMPDIR", "USER", "SHELL"]
# "per-stage": every stage agent gets a fresh empty HOME under the work folder, removed when it finishes (it will not see
# the parent's CLI logins). Unset = the parent's HOME.
# home = "per-stage"
# Reviewers (review, gate, addendum, ui) run under macOS sandbox-exec with writes to the checkout denied.
# Without sandbox-exec (Linux) they refuse to start unless this is false; then only the post-run clean-worktree check guards.
require_sandbox = true

[tripwire]
# Settings file watched for damage while an agent runs: gone/unreadable, a setting removed, or a
# credential/endpoint/repo key changed stops every chain. Empty settings_file disables the tripwire.
settings_file = ""

[project]
# Per-project section for the agents' shared field guide: repo map, local check commands, forbidden
# paths/ports. The generic guide (chain/prompts/field-guide.md) plus this file is what every stage reads.
field_guide = ""

[limits]
# Overrides for chain/flow.json limits (the names are the keys of its "limits" block). Kept here so an upgrade of
# the kit never loses them, while the flow itself stays the kit's current version. -1 means no limit.
# prs_at_once = 3        # PRs the chain works on at the same time
# max_rounds = 4         # review/fix rounds per run

[notify]
command = ""                         # pages you when the loop is down (called with one message argument); empty = off
