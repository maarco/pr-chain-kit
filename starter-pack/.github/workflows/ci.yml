name: CI

# Template distilled from a production repo's ci.yml (see starter-pack/README.md for the full original
# shape). PLACEHOLDER markers name everything to adapt. The pr-chain defaults expect these check names:
# ci/tests, ci/standards-check (set them in pr-chain.toml [accounts] checks when you rename).

on:
  pull_request:
    branches: [main]          # PLACEHOLDER: add "release/**", "integration/**" if you use lane branches
  push:
    branches: [main]
  # A push performed with GITHUB_TOKEN cannot trigger another workflow; the post-auto-merge gate
  # uses this explicit event to run CI against main.
  workflow_dispatch:
  # The merge queue tests each queued PR merged onto the latest main, so required checks must
  # also report on the queue's merge-group commits.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  tests:
    name: ci/tests (${{ matrix.shard.gem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]   # PLACEHOLDER: your floor runtime
        # Gem-named shards keep every leg short; the names are cosmetic (the hash split below
        # decides content), the index feeds it, and SHARD_COUNT must match the list length.
        shard:
          - { index: 0, gem: amber }
          - { index: 1, gem: beryl }
          - { index: 2, gem: coral }
          - { index: 3, gem: diamond }
    env:
      SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install project
        run: uv sync    # PLACEHOLDER: your dependency install (uv sync / pip install -e . / npm ci)
      - name: Run unit test shard
        run: |
          # PLACEHOLDER: point at your test layout. The hash split keeps each shard stable and
          # balanced without listing files by hand.
          mapfile -t all < <(uv run python - <<'PY'
            import hashlib, pathlib
            for p in sorted(pathlib.Path("tests").glob("**/test_*.py")):
                if hashlib.sha256(b"ci-tests:" + str(p).encode()).digest()[0] % int(__import__("os").environ["SHARD_COUNT"]) == int(__import__("os").environ["SHARD_INDEX"]):
                    print(p)
          PY
          )
          uv run python -m pytest -q "${all[@]}"
        env:
          SHARD_INDEX: ${{ matrix.shard.index }}

  standards-check:
    name: ci/standards-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Lint (narrow rule set; the tree carries style noise a full run would stop on)
        run: uv run python -m ruff check --select E9,F63,F7,F82 .   # PLACEHOLDER: your source roots
      - name: Compile every entry point
        run: uv run python -m py_compile YOUR_ENTRY.py              # PLACEHOLDER: your entry files
      - name: Changelog fragment check
        run: uv run python scripts/changelog.py check --diff-base "$BASE" --branch "${{ github.head_ref || github.ref_name }}"
        env:
          BASE: origin/${{ github.event.pull_request.base.ref || 'main' }}

  gate:
    name: ci/tests
    needs: [tests, standards-check]
    # Runs always: a skipped gate is not SUCCESS to the chain, so a red shard would leave it waiting forever.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required test job passed
        run: test "${{ needs.tests.result }}" = success && test "${{ needs.standards-check.result }}" = success
