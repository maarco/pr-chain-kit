[project]
name = "pr-chain"
dynamic = ["version"]
description = "Walk GitHub pull requests through review, fix, audit, UI review, CI and merge, with a fresh AI agent per stage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["github", "pull-requests", "code-review", "ai-agents", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/OWNER/pr-chain-kit"
Issues = "https://github.com/OWNER/pr-chain-kit/issues"
Changelog = "https://github.com/OWNER/pr-chain-kit/blob/main/CHANGELOG.md"

[project.scripts]
pr-chain = "pr_chain_kit.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pr_chain_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pr_chain_kit"]
exclude = ["chain/tests", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"bin" = "pr_chain_kit/kit/bin"
"chain" = "pr_chain_kit/kit/chain"
"agent-kit" = "pr_chain_kit/kit/agent-kit"
"examples" = "pr_chain_kit/kit/examples"
"starter-pack" = "pr_chain_kit/kit/starter-pack"
"vendor" = "pr_chain_kit/kit/vendor"
"pr-chain.toml" = "pr_chain_kit/kit/pr-chain.toml"
"SOFTWARE_DEVELOPMENT_LIFECYCLE.md" = "pr_chain_kit/kit/SOFTWARE_DEVELOPMENT_LIFECYCLE.md"

[tool.hatch.build.targets.sdist]
exclude = ["pr-chain.local.toml", "**/__pycache__"]
