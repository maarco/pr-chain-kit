name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tools the tests use
        run: |
          python -m pip install --quiet ruff
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Tests
        run: |
          fail=0
          for t in chain/tests/test_*.py; do
            if python -B "$t" > "$t.log" 2>&1; then echo "ok   $t"; else echo "FAIL $t"; tail -40 "$t.log"; fail=1; fi
          done
          exit $fail

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and check
        run: |
          uv build
          uvx twine check dist/*
          uvx --from dist/*.whl pr-chain --help
          uvx --from dist/*.whl pr-chain path

  changelog:
    # Entries live in changes/<name>.<section>.md. A PR may not edit CHANGELOG.md unless its branch starts with release/ or changelog/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 2 keeps the PR merge commit's parents, so the check can diff against the base.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check changelog entries
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/changelog.py check --diff-base HEAD^1 --branch "$HEAD_BRANCH"
          else
            python3 scripts/changelog.py check
          fi
