name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute on Linux. A hung leg is stopped here, so ci/tests fails instead of waiting 360 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tools the tests use
        run: |
          python -m pip install --quiet ruff
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Tests
        run: |
          fail=0
          for t in chain/tests/test_*.py; do
            if python -B "$t" > "$t.log" 2>&1; then echo "ok   $t"; else echo "FAIL $t"; tail -40 "$t.log"; fail=1; fi
          done
          exit $fail

  # The check the chain requires (pr-chain.toml [accounts] checks): one check for the whole suite. It also runs after a
  # red shard, so a red shard reads as FAILURE; a skipped check never finishes and the chain waits for it.
  gate:
    name: ci/tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every test shard passed
        run: |
          result="${{ needs.tests.result }}"
          echo "tests: $result"
          test "$result" = success

  package:
    runs-on: ubuntu-latest
    # A hung step is stopped here, so the package check finishes instead of waiting 360 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and check
        run: |
          uv build
          uvx twine check dist/*
          uvx --from dist/*.whl pr-chain --help
          uvx --from dist/*.whl pr-chain path
