name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tools the tests use
        run: |
          python -m pip install --quiet ruff
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Tests
        run: |
          fail=0
          for t in chain/tests/test_*.py; do
            if python -B "$t" > "$t.log" 2>&1; then echo "ok   $t"; else echo "FAIL $t"; tail -40 "$t.log"; fail=1; fi
          done
          exit $fail

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and check
        run: |
          uv build
          uvx twine check dist/*
          uvx --from dist/*.whl pr-chain --help
          uvx --from dist/*.whl pr-chain path

  # The required check pr-chain waits for (pr-chain.toml [accounts] checks). It reports after every job above has
  # finished and fails unless they all passed: a skipped check reads as pending to the chain, which waits for it forever.
  ci-tests:
    name: ci/tests
    if: always()
    needs: [tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the test and package jobs passed
        run: |
          test "${{ needs.tests.result }}" = success
          test "${{ needs.package.result }}" = success
