name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tools the tests use
        run: |
          python -m pip install --quiet ruff
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Tests
        run: |
          fail=0
          for t in chain/tests/test_*.py; do
            if python -B "$t" > "$t.log" 2>&1; then echo "ok   $t"; else echo "FAIL $t"; tail -40 "$t.log"; fail=1; fi
          done
          exit $fail

  package:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and check
        run: |
          uv build
          uvx twine check dist/*
          uvx --from dist/*.whl pr-chain --help
          uvx --from dist/*.whl pr-chain path

  gate:
    # The chain requires the check named ci/tests (pr-chain.toml). It runs always and fails itself unless every job it
    # needs passed: a skipped gate is not SUCCESS to the chain, so the chain would wait on it forever.
    name: ci/tests
    needs: [tests, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job it needs passed
        run: test "${{ needs.tests.result }}" = success && test "${{ needs.package.result }}" = success
